<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kong Kong 3D Gallery </title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 9999;
            font-weight: 500;
            letter-spacing: 1px;
        }
        /* 复位按钮额外样式（脚本会动态创建，此处仅作兜底） */
        .reset-btn {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>
    <div id="loading">✨ 加载梦幻世界...</div>

    <!-- 导入映射：确保 Three.js 和 GSAP 正确加载 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js"
            }
        }
    </script>

    <!-- 主逻辑脚本 -->
    <script type="module" src="./script10.js"></script>
</body>
</html>
