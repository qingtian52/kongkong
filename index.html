<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Kong Kong 3D Gallery</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 全新的加载进度条覆盖层 - 深蓝灰半透明风格 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(167, 190, 225, 0.1);   /* 深蓝灰色，不透明度0.7 */
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        }
        .loading-container {
            width: 360px;
            max-width: 80vw;
            text-align: center;
            background: rgba(22, 35, 56, 0.4);   /* 半透明深蓝底色 */
            border-radius: 32px;
            padding: 32px 36px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(135, 206, 235, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(135, 206, 235, 0.3);
        }
        .loading-text {
            color: #f0f8ff;
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 22px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #8796eb;  /* 天蓝色 */
            border-radius: 20px;
            transition: width 0.2s ease-out;
            box-shadow: 0 0 8px #8796eb;
        }
        .loading-sub {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(220, 240, 255, 0.8);
            letter-spacing: 1px;
        }
        /* 隐藏旧 loading 元素 */
        #loading {
            display: none !important;
        }
    </style>
    <!-- 导入映射 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/",
                "gsap": "https://unpkg.com/gsap@3.12.5/index.js",
                "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.mjs"
            }
        }
    </script>
    <script type="module" src="./script13.js"></script>
</head>
<body>
    <div id="loading" style="display:none;">✨ 加载梦幻世界...</div>
</body>
</html>
